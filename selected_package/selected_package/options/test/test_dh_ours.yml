#### general settings
name: DH_Full_Test_Ours
suffix: ~  
model: denoising
distortion: derain
gpu_ids: [0]

sde:
  max_sigma: 30
  T: 100
  schedule: cosine
  eps: 0.005

#### datasets
datasets:
  test1:
    name: DhMurals1714_Full_Test
    mode: GT
    # 严格指向 DH 的目录
    dataroot_GT: /root/autodl-tmp/data/mural/DhMurals1714/test/images
    mask_root: /root/autodl-tmp/data/mural/DhMurals1714/test/masks
    prompt_path: /root/autodl-tmp/data/mural/DhMurals1714/test/prompts_qwen_degradation.json

#### network structures
network_G:
  which_model_G: ConditionalUNet
  setting:
    in_nc: 3
    out_nc: 3
    nf: 64
    depth: 4
    
network_Gs:
  which_model_G: ConditionalUNets
  setting:
    in_nc: 1
    out_nc: 1
    nf: 64
    depth: 4

#### path
path:
  # 指向你最新的 4090 训练权重
  pretrain_model_G: /root/autodl-tmp/StrDiffusion_Official/train/experiments/inpainting/StrDiffusion_Ours_Final_RTX4090/models/latest_G.pth
  pretrain_model_Gs: /root/autodl-tmp/models/psv/psv,T=100/s.pth
  pretrain_model_D: /root/autodl-tmp/models/psv/psv,T=100/dis.pth
  strict_load: false